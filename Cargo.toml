[package]
name = "Hermes"
version = "0.0.1"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-tungstenite = "0.29.0"
actix-web = "4"
thiserror = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
local-ip-address = "0.6"
futures-util = "0.3.31"
tungstenite = "0.29.0"
toml = "1.1.2+spec-1.1.0"
bb8 = "0.9.1"
redis = { version = "1.2.0", features = ["tokio-comp", "connection-manager"] }
bb8-redis = "0.26.0"